<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinderKat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="relative w-full max-w-sm h[-600px] bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col">
        <div class="p-4 flex justify-between items-center border-b">
            <button onclick="toggleFavorites()" class="text-gray-400 hover:text-pink-500 transition">
                <i class="fas fa-history text-xl"></i>
            </button>
            <h1 class="text-2xl font-bold text-pink-500"><i class="fas fa-paw"></i> TinderKat</h1>
            <div class="w-8"></div>
        </div>




        <div class="relative flex-1 p-4 flex items-center justify-center overflow-hidden">
            <div id="loader" class="absolute inset-0 flex items-center justify-center bg-white z-10">
                <div class="animate-bounce text-pink-500 text-4xl">
                    <i class="fas fa-cat"></i>
                </div>
            </div>

            <div id="card" class="cat-card w-full h-full rounded-2xl overflow-hidden shadow-lg relative bg-gray-200">
                <img id="cat-img" alt="Cat" class="w-full h-full object-cover">
                <div
                    class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/70 to-transparent text-white">
                    <h2 class="text-2xl font-bold">Cute Cat</h2>
                    <p>2km</p>
                </div>
            </div>
        </div>

        <div class="p-6 flex justify-evenly items-center bg-white">
            <button onclick="handleSwipe('left')"
                class="w-14 h-14 rounded-full border-2 border-red-500 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all transform active:scale-90">
                <i class="fas fa-times text-2xl"></i>
            </button>
            <button onclick="handleSwipe('right')"
                class="w-16 h-16 rounded-full border-2 border-green-500 text-green-500 flex items-center justify-center hover:bg-green-500 hover:text-white transition-all transform active:scale-90">
                <i class="fas fa-heart text-3xl"></i>
            </button>
        </div>
    </div>

    <div id="fav-panel" class="fixed inset-0 bg-black/50 hidden z-20 backdrop-blur-sm">
        <div class="absolute right-0 top-0 h-full w-80 bg-white p-6 shadow-2xl overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800">Matches ❤️</h3>
                <button onclick="toggleFavorites()" class="text-gray-500"><i class="fas fa-times"></i></button>
            </div>

            <div id="fav-list" class="grid grid-cols-2 gap-2">
            
            </div>
            <button onclick="clearFavorites()" class="mt-8 w-full py-2 text-red-500 text-sm font-semibold border border-red-200 rounded-lg hover:bg-red-50">
                Borrar Historial
            </button>
        </div>
    </div>


    <script src="index.js"></script>
</body>

</html>
